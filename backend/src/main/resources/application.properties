spring.application.name=backend
server.port=3000
gemini.api.key=YOUR_API_GEMINI_KEY_HERE

# Persistent H2 Embedded Database
spring.datasource.url=jdbc:h2:file:./data/buggraphdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Visual Web Console (http://localhost:3000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true